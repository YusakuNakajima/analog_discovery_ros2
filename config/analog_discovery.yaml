# Analog Discovery triggered capture settings.
# Acquisition defaults are set for the NF AE9501B RF output (AE, 100 kHz-2 MHz)
# on CH1, from captures on the real AD3 at OnoLab on 2026-10-22 (finger taps on
# the sensor: peaks 0.02-1.16 V, median 0.50 V; noise before a hit 1-5 mV rms;
# ring-down often longer than 2.46 ms). Changed from the bring-up values
# (1 MHz, 8192, 1024 pretrigger, 0.1 V / 0.01 V). Not yet tuned for an experiment.
analog_discovery:
  ros__parameters:
    backend: dwf             # dwf (WaveForms SDK, real device) | mock (simulated impulse)
    serial: ''               # '' = first free AD3/AD2; e.g. '210415BF81F3'
    config_index: -1         # -1 = device configuration with the largest scope buffer (AD3: 32768)
    frame_id: analog_discovery
    poll_period_s: 0.005     # s, how often the device is asked whether a capture is done
    settle_s: 0.2            # s, wait after configuring before the first capture (README)

    sample_rate_hz: 10000000.0 # Hz per channel (AD3 up to 125 MHz); 5x the AE9501B 2 MHz band edge
    buffer_samples: 32768      # samples per channel per capture (3.28 ms at 10 MHz; AD3 maximum)
    ch2_enabled: true
    ch1_range_peak_v: 2.5      # +-V; AD3 offers +-2.5 V and +-25 V
    ch2_range_peak_v: 2.5

    trigger_source: ch1        # ch1 | ch2 | none (free running; needs auto_timeout_s > 0)
    trigger_slope: rising      # rising | falling | either
    trigger_level_v: 0.02      # V; 4-20x the noise before a hit, caught every tap
    trigger_hysteresis_v: 0.005 # V; level / 4, as used in the captures above
    pretrigger_samples: 4096   # samples kept before the trigger (0.41 ms at 10 MHz; 2.87 ms after)
    auto_timeout_s: 0.0        # s; 0 = wait for a real trigger, > 0 = capture anyway after this

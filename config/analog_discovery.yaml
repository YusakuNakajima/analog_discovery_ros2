# Analog Discovery triggered capture settings.
# Defaults are provisional (chosen for impulse capture while bringing up the
# driver), not tuned for an experiment.
analog_discovery:
  ros__parameters:
    backend: dwf             # dwf (WaveForms SDK, real device) | mock (simulated impulse)
    serial: ''               # '' = first free AD3/AD2; e.g. '210415BF81F3'
    config_index: -1         # -1 = device configuration with the largest scope buffer (AD3: 32768)
    frame_id: analog_discovery
    poll_period_s: 0.005     # s, how often the device is asked whether a capture is done
    settle_s: 0.2            # s, wait after configuring before the first capture (README)

    sample_rate_hz: 1000000.0  # Hz per channel (AD3 up to 125 MHz)
    buffer_samples: 8192       # samples per channel per capture (8.192 ms at 1 MHz)
    ch2_enabled: true
    ch1_range_peak_v: 2.5      # +-V; AD3 offers +-2.5 V and +-25 V
    ch2_range_peak_v: 2.5

    trigger_source: ch1        # ch1 | ch2 | none (free running; needs auto_timeout_s > 0)
    trigger_slope: rising      # rising | falling | either
    trigger_level_v: 0.1       # V
    trigger_hysteresis_v: 0.01 # V
    pretrigger_samples: 1024   # samples kept before the trigger (1.024 ms at 1 MHz)
    auto_timeout_s: 0.0        # s; 0 = wait for a real trigger, > 0 = capture anyway after this
